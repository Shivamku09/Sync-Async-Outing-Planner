application:
  name: Sync Async Outing Planner
  environment: production

database:
  url: postgresql+asyncpg://postgres:postgres@localhost:5432/outing_planner
  pool_size: 10
  max_overflow: 10

rabbitmq:
  url: amqp://guest:guest@localhost:5672/
  planner_prefetch: 4
  callback_prefetch: 8

callback:
  connect_timeout_seconds: 2.0
  read_timeout_seconds: 5.0
  max_response_bytes: 65536
  max_attempts: 4
  allow_localhost: false

outbox:
  batch_size: 50
  poll_interval_seconds: 0.5

api:
  default_page_size: 20
  maximum_page_size: 100
  async_backlog_limit: 10000
